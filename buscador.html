<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Búsqueda - AnimeKT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    
    <!-- ========================================== -->
    <!-- 👇 PEGA AQUÍ TU <nav class="navbar"> COMPLETO DE HOME.HTML 👇 -->
    <!-- ========================================== -->
    
    <nav class="navbar">
        <div class="nav-left">
            <a href="/home.html" class="logo">AnimeKT</a>
            <ul class="nav-links">
                <li><a href="/buscador.html" class="active">Catálogo</a></li>
                <li><a href="/Favoritos.html">Favoritos</a></li>
            </ul>
        </div>
        
        <div class="nav-right">
            
            
            <!-- Perfil y Ajustes -->
            <div class="profile-menu" id="profile-menu">
                <div class="profile-icon" id="profile-icon">
                    <!-- Icono SVG de usuario -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <!-- Menú Desplegable -->
                <div class="dropdown-content" id="dropdown-content">
                    <a href="#">Ajustes de cuenta</a>
                    <a href="#">Mi Lista</a>
                    <hr style="border-color: #444; margin: 0;">
                    <a href="#" id="btn-logout-nav" style="color: #ff5555;">Cerrar Sesión</a>
                </div>
            </div>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- 👆 HASTA AQUÍ 👆 -->
    <!-- ========================================== -->

    <!-- Contenedor Principal del Catálogo / Búsqueda -->
    <section class="search-page-section">
        <!-- Nuevo Buscador Gigante -->
        <div class="massive-search-container">
            <input type="text" id="massive-search-input" placeholder="Buscar anime...">
            <button id="massive-search-btn">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
        
        <!-- Filtro Alfabético -->
        <div class="alphabet-filter" id="alphabet-container">
            <!-- Los botones A-Z se generarán con JavaScript -->
        </div>

        <!-- Filtros Desplegables -->
        <div class="dropdown-filters">
            <div class="custom-select">
                <select id="filter-tipo">
                    <option value="">Tipo: Seleccionar</option>
                    <option value="tv">TV</option>
                    <option value="ova">OVA</option>
                    <option value="pelicula">Película</option>
                    <option value="especial">Especial</option>
                </select>
            </div>
            <div class="custom-select">
                <select id="filter-genero">
                    <option value="">Género: Seleccionar</option>
                    <option value="accion">Acción</option>
                    <option value="comedia">Comedia</option>
                    <option value="ciencia ficcion">Ciencia Ficción</option>
                    <option value="superpoderes">Superpoderes</option>
                </select>
            </div>
            <div class="custom-select">
                <select id="filter-ano">
                    <option value="">Año: Seleccionar</option>
                </select>
            </div>
            <div class="custom-select">
                <select id="filter-estado">
                    <option value="">Estado: Seleccionar</option>
                    <option value="emision">En Emisión</option>
                    <option value="finalizado">Finalizado</option>
                </select>
            </div>
            <button class="btn-filtrar" id="btn-apply-filters">Filtrar</button>
        </div>

        <!-- Información de Resultados y Ordenamiento -->
        <div class="results-header">
            <span class="results-count" id="results-count">0 Resultados</span>
            <div class="sort-container">
                <label for="sort-select">Ordenar por:</label>
                <select id="sort-select" class="sort-select">
                    <option value="default">Predeterminado</option>
                    <option value="az">A-Z</option>
                    <option value="za">Z-A</option>
                    <option value="recientes">Más recientes</option>
                </select>
            </div>
        </div>

        <!-- Grilla de Resultados -->
        <div class="search-results-grid" id="search-results-grid">
            <!-- Las tarjetas se inyectarán aquí -->
        </div>
    </section>

    <script type="module" src="/buscador.js"></script>
</body>
</html>
