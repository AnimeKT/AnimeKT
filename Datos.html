<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalles del Anime - AnimeKT</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="styles3.css">
</head>

    
    
    
    <nav class="navbar">
        <div class="nav-left">
            <a href="/home.html" class="logo">AnimeKT</a>
            <ul class="nav-links">
                <li><a href="/buscador.html">Catálogo</a></li>
                <li><a href="/Favoritos.html">Favoritos</a></li>
            </ul>
        </div>
        
        <div class="nav-right">
            <div class="nav-search-container" id="navSearchContainer">
                <div class="search-input-wrapper">
                    <input type="text" id="navSearchInput" placeholder="Buscar anime..." autocomplete="off">
                    <i class="fas fa-search"></i>
                </div>
                <div id="navSearchResults" class="nav-search-results hidden">
                    <div class="results-list" id="miniResultsList"></div>
                    <button id="seeMoreBtn" class="see-more-btn">Ver más resultados</button>
                </div>
            </div>

            <div class="profile-menu" id="profile-menu">
                <div class="profile-icon" id="profile-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="dropdown-content" id="dropdown-content">
                    <a href="#">Ajustes de cuenta</a>
                    <a href="#">Mi Lista</a>
                    <hr style="border-color: #444; margin: 0;">
                    <a href="#" id="btn-logout-nav" style="color: #ff5555;">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    
    
    
    <section class="cr-hero" id="hero-background">
        <div class="cr-overlay"></div>
        <div class="cr-content">
            
            
            <div id="datos-header">
                
                <div class="cr-skeleton-title skeleton-anim"></div>
                <div class="cr-skeleton-meta skeleton-anim"></div>
            </div>

            
            <div class="cr-actions">
                <button id="btn-comenzar-ver" class="cr-btn-primary">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    COMENZAR A VER
                </button>
                <button id="btn-hero-fav" class="cr-btn-icon" title="Añadir a favoritos">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <button class="cr-btn-icon" title="Añadir a lista">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="cr-btn-icon" title="Compartir">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </button>
            </div>

            
            <div class="cr-details-grid">
                
                
                <div class="cr-synopsis" id="synopsis-container">
                    <div id="synopsis-skeleton">
                        <div class="cr-skeleton-line skeleton-anim"></div>
                        <div class="cr-skeleton-line skeleton-anim"></div>
                        <div class="cr-skeleton-line skeleton-anim"></div>
                        <div class="cr-skeleton-line skeleton-anim"></div>
                    </div>
                    <div id="synopsis-text" style="display: none;">
                        
                    </div>
                </div>

                
                <div class="cr-technical-data" id="technical-data-container" style="display: none;">
                    <p>Audio: <span id="data-audio">Cargando...</span></p>
                    <p>Estudio: <span id="data-studio">Cargando...</span></p>
                    <p>Estado: <span id="data-status">Cargando...</span></p>
                    
                </div>

            </div>
        </div>
    </section>

    
    <script type="module" src="/Datos.js"></script>
</body>
</html>
