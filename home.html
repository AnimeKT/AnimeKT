<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - AnimeKT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/home.html" class="logo">AnimeKT</a>
            <ul class="nav-links">
                <li><a href="/buscador.html" class="active">Catálogo</a></li>
                <li><a href="/Favoritos.html">Favoritos</a></li>
            </ul>
        </div>
        
        <div class="nav-right">
            <!-- Mini Buscador en Navbar -->
            <div class="nav-search-container" id="navSearchContainer">
                <div class="search-input-wrapper">
                    <input type="text" id="navSearchInput" placeholder="Buscar anime..." autocomplete="off">
                    <i class="fas fa-search"></i>
                </div>
                <div id="navSearchResults" class="nav-search-results hidden">
                    <div class="results-list" id="miniResultsList"></div>
                    <button id="seeMoreBtn" class="see-more-btn">Ver más resultados</button>
                </div>
            </div>

            <!-- Perfil y Ajustes -->
            <div class="profile-menu" id="profile-menu">
                <div class="profile-icon" id="profile-icon">
                    <!-- Icono SVG de usuario -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <!-- Menú Desplegable -->
                <div class="dropdown-content" id="dropdown-content">
                    <a href="#">Ajustes de cuenta</a>
                    <a href="#">Mi Lista</a>
                    <hr style="border-color: #444; margin: 0;">
                    <a href="#" id="btn-logout-nav" style="color: #ff5555;">Cerrar Sesión</a>
                </div>
            </div>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION (Banner Destacado) -->
        <section class="hero-section">
            <!-- Flechas Laterales -->
            <button class="hero-arrow left-arrow">❮</button>
            <button class="hero-arrow right-arrow">❯</button>

            <!-- Contenedor del Slide -->
            <div class="hero-slide">
                <!-- Contenido Izquierdo (Textos y Botones) -->
                <div class="hero-content">
                    
                    <!-- Título -->
                        <h1 class="hero-title-img">
                            <!-- Esqueletos del título (2 rectángulos gruesos) -->
                            <div class="skeleton-text skeleton-anim" style="height: 38px; width: 80%; margin-bottom: 12px;"></div>
                            <div class="skeleton-text skeleton-anim" style="height: 38px; width: 50%;"></div>
                        </h1>
                        
                        <!-- Metadatos -->
                        <div class="hero-meta">
                            <span class="meta-tags">
                                <!-- Esqueleto de los tags -->
                                <div class="skeleton-text skeleton-anim" style="height: 14px; width: 250px; display: inline-block;"></div>
                            </span>
                        </div>
                        
                        <!-- Caja de Descripción (Cambiamos la etiqueta <p> por <div> para evitar errores de HTML al meterle rectángulos) -->
                        <div class="hero-description">
                            <!-- Esqueletos de la sinopsis (4 líneas delgadas) -->
                            <div class="skeleton-text skeleton-anim" style="height: 12px; width: 100%; margin-bottom: 10px;"></div>
                            <div class="skeleton-text skeleton-anim" style="height: 12px; width: 95%; margin-bottom: 10px;"></div>
                            <div class="skeleton-text skeleton-anim" style="height: 12px; width: 90%; margin-bottom: 10px;"></div>
                            <div class="skeleton-text skeleton-anim" style="height: 12px; width: 60%;"></div>
                        </div>
                    
                    <!-- Botones de Acción -->
                    <div class="hero-actions">
    <button id="btn-hero-play" class="btn-hero-primary">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        CONTINUAR VIENDO
    </button>
    <button id="btn-hero-fav" class="btn-hero-secondary">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>
</div>

                    <!-- Indicadores (Rayitas inferiores) -->
                    <div class="hero-indicators">
                        <span class="indicator active"></span>
                        <span class="indicator"></span>
                        <span class="indicator"></span>
                        <span class="indicator"></span>
                        <span class="indicator"></span>
                    </div>
                </div>

                <!-- Espacio Derecho (Aquí se proyectará el arte del Anime) -->
                <div class="hero-image-placeholder">
                    <div class="hero-layer layer-1 active"></div>
                    <div class="hero-layer layer-2"></div>
                </div>
            </div>
        </section>

        <section class="catalog-section">
        <h2 class="section-title">Catalogo</h2>
        
        <div class="carousel-container">


            <div class="carousel-track">
                <!-- ESQUELETO 1 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 2 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 3 -->

                <!-- ESQUELETO 4 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 5 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 6 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 7 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 8 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 9 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 10 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 11 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <!-- ESQUELETO 12 -->
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
                <div class="anime-card skeleton-card"><div class="card-image-wrapper skeleton-anim"></div><div class="card-info"><div class="skeleton-text skeleton-title skeleton-anim"></div><div class="skeleton-text skeleton-tags skeleton-anim"></div></div></div>
            </div>
        </div>
    </section>


    <!-- Script de protección y carga -->
    <script type="module" src="/home.js"></script>
</body>
</html>
