<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AnimeKT</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-effect.css">
    
    <script>
        if (localStorage.getItem("telegram_session")) {
            window.location.replace("/home.html");
        }
    </script>
</head>

<body>
    
    <div class="contenedor-registro" id="caja-registro">

        <h2 class="titulo-principal">AnimeKaergsty</h2>

        <form id="formulario-conexion" autocomplete="off" novalidate>
            <div id="api-credentials-step">
                <div class="grupo-input">
                    <label>API ID:</label>
                    <div class="input-contenedor">
                        <input type="text" id="user-api-id" name="user-api-id" autocomplete="off" autocapitalize="off" placeholder="Ej: 1234567" required>
                        <div class="portal-spark"></div>
                    </div>
                </div>

                <div class="grupo-input">
                    <label>API HASH:</label>
                    <div class="input-contenedor">
                        <input type="text" id="user-api-hash" name="user-api-hash" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ej: 274305..." required>
                        <div class="portal-spark"></div>
                    </div>
                </div>



                <button id="btn-save-api" type="button" class="btn-morado">Entrar</button>

                    <div class="contenedor-enlaces">
                        <a href="https://my.telegram.org/auth" target="_blank" class="link-registro">Regístrate con Telegram</a>
                        <a href="https://t.me/s/KaergstyRegister" target="_blank" class="link-registro">Ayuda</a>
                    </div>
                    
            </div>

            <div id="login-methods-container" class="hidden">
                <p class="subtitulo">Iniciar sesión</p>

                <div id="flow-phone">
                    <div id="step-phone">
                        <div class="input-contenedor">
                            <input type="text" id="phone-input" name="phone-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Número (Ej: +34600000000)" />
                            <div class="portal-spark"></div>
                        </div>
                        <button id="btn-send-code" type="button" class="btn-morado">Enviar Código</button>
                    </div>

                    <div id="step-code" class="hidden">
                        <div class="input-contenedor">
                            <input type="text" id="code-input" name="code-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Código de Telegram" />
                            <div class="portal-spark"></div>
                        </div>
                        <button id="btn-verify-code" type="button" class="btn-morado">Verificar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
